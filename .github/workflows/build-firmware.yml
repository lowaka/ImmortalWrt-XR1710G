name: Build Router Firmware

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
          - none
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CONFIG_FILE: config.seed
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: router-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record start time
        run: |
          echo "TIME0=$(TZ=${TZ} date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$(TZ=${TZ} date '+%Y%m%d')" >> "$GITHUB_ENV"

      - name: Prepare build environment
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          sudo rm -rf /usr/share/{dotnet,man,doc,groff,info,lintian,linda,locale} \
                      /usr/local/lib/android /opt/ghc /usr/lib/jvm /usr/share/swift \
                      /usr/local/go /opt/hostedtoolcache/* /usr/share/az_*
          sudo docker system prune -af --volumes || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
              ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
              bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
              genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
              libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
              libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
              python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
              swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Configure
        run: |
          echo "=== Copying $CONFIG_FILE to .config ==="
          cp $CONFIG_FILE .config
          echo "=== Config content (first 50 lines) ==="
          head -50 .config
          echo "=== Running make defconfig ==="
          make defconfig

      - name: Download sources
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
          du -sh dl

      - name: Build firmware
        id: compile
        run: |
          make V=s -j2 || make V=s -j1

      - name: Organize output
        id: organize
        run: |
          cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
          echo "TIME1=$(TZ=${TZ} date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          echo "=== Firmware files ==="
          ls -lh

      - name: Calculate build time
        run: |
          START_TIME=$(TZ=${TZ} date -d "${{ env.TIME0 }}" +%s)
          END_TIME=$(TZ=${TZ} date -d "${{ env.TIME1 }}" +%s)
          ELAPSED_SECONDS=$((END_TIME - START_TIME))
          ELAPSED_FORMATTED=$(printf "%02dh %02dm %02ds" $((ELAPSED_SECONDS/3600)) $((ELAPSED_SECONDS%3600/60)) $((ELAPSED_SECONDS%60)))
          echo "ELAPSED=$ELAPSED_FORMATTED" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Router-Firmware-${{ github.run_number }}
          path: ${{ env.FIRMWARE_DIR }}/*
          retention-days: 30

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ format('{0} - Router Build', env.RELEASE_TAG) }}
          body: ${{ github.event.inputs.release_notes || format('Build Date: {0}', env.RELEASE_TAG) }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: ${{ env.FIRMWARE_DIR }}/*
